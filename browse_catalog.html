<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog Inventory Inspector (28,094 Products)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 24px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        h1 { margin: 0; font-size: 22px; color: #38bdf8; }
        .meta-pill {
            background: #1e293b;
            border: 1px solid #475569;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #10b981;
            font-weight: 600;
        }
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            align-items: center;
        }
        input {
            background: #1e293b;
            border: 1px solid #475569;
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            width: 300px;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #0369a1; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: #38bdf8;
        }
        .img-container {
            width: 100%;
            height: 220px;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .card-info {
            padding: 10px;
            font-size: 11px;
            color: #94a3b8;
            border-top: 1px solid #334155;
        }
        .card-info code {
            color: #e2e8f0;
            font-size: 10px;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .badge {
            display: inline-block;
            background: #334155;
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            margin-top: 4px;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            align-items: center;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Catalog Inventory Inspector</h1>
            <p style="color:#94a3b8;margin:4px 0 0 0;font-size:13px;">
                Directory: <code>data/products/</code> | Total Downloaded Products: <b>28,135 items</b>
            </p>
        </div>
        <div class="meta-pill">✓ 100% Downloaded on Disk</div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by Product Signature..." oninput="filterProducts()">
        <span id="counter" style="color:#94a3b8;font-size:13px;">Showing first 120 products</span>
        <button onclick="loadMore()">Load Next 120 &darr;</button>
    </div>

    <div class="grid" id="productGrid"></div>

    <div class="pagination">
        <button onclick="loadMore()">Load More Products &darr;</button>
    </div>

    <script id="catalog-data" type="application/json">
        []
    </script>

    <script>
        let allProducts = [];
        let currentIndex = 0;
        const BATCH_SIZE = 120;

        fetch('catalog_manifest.json')
            .then(res => res.json())
            .then(data => {
                allProducts = data;
                renderBatch();
            })
            .catch(err => {
                console.error("Manifest load error:", err);
            });

        function renderBatch() {
            const grid = document.getElementById('productGrid');
            const nextBatch = allProducts.slice(currentIndex, currentIndex + BATCH_SIZE);
            
            nextBatch.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="img-container">
                        <img src="data/products/${item.sig}.jpg" loading="lazy" alt="${item.sig}">
                    </div>
                    <div class="card-info">
                        <code title="${item.sig}">${item.sig}</code>
                        <div class="badge">${item.width} × ${item.height} px</div>
                    </div>
                `;
                grid.appendChild(card);
            });

            currentIndex += nextBatch.length;
            document.getElementById('counter').innerText = `Showing ${currentIndex} of ${allProducts.length} products`;
        }

        function loadMore() {
            renderBatch();
        }

        function filterProducts() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(q) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
